name: Snes-Macheen Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/snes9x-backend ]
    paths:
      - 'android/**'
      - 'cpu/**'
      - 'memory/**'
      - 'cartridge/**'
      - 'ppu/**'
      - 'frontend/**'
      - 'input/**'
      - 'timing/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  host-quality:
    name: Host regression and strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Run release quality gate
        run: bash quality.sh

  android-apk:
    name: Build Android APK (ARM64 + ARMv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install pinned Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
      - name: Fetch pinned SDL2 Android source
        run: bash android/fetch_sdl2.sh
      - name: Fetch Snes9x Libretro Android cores
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          curl --fail --location --retry 3 \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip \
            -o "$RUNNER_TEMP/snes9x-arm64.zip"
          curl --fail --location --retry 3 \
            https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/snes9x_libretro_android.so.zip \
            -o "$RUNNER_TEMP/snes9x-armv7.zip"
          unzip -o "$RUNNER_TEMP/snes9x-arm64.zip" -d android/app/src/main/jniLibs/arm64-v8a
          unzip -o "$RUNNER_TEMP/snes9x-armv7.zip" -d android/app/src/main/jniLibs/armeabi-v7a
          test -s android/app/src/main/jniLibs/arm64-v8a/snes9x_libretro_android.so
          test -s android/app/src/main/jniLibs/armeabi-v7a/snes9x_libretro_android.so
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: android
      - name: Sign APK with permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE="$RUNNER_TEMP/snes-macheen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          rm -f "$KEYSTORE"
        working-directory: android
      - name: Verify APK and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmain.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libmain.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/snes9x_libretro_android.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/snes9x_libretro_android.so'
          echo "APK and bundled Snes9x cores verified: $APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Snes-Macheen-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
