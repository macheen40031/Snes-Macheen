plugins {
    id 'com.android.application'
}
// v1.31 immersive full-screen and Bluetooth controller readiness build.
android {
    namespace 'com.snesmacheen'
    compileSdk 36
    defaultConfig {
        applicationId 'com.snesmacheen'
        minSdk 23
        targetSdk 36
        versionCode 41
        versionName '1.31'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Wpedantic'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
